spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:mysql://localhost:3306/zepto
    username: root
    password: Nikhil@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

management:
  tracing:
    sampling:
      probability: 1.0
  observations:
    key-values:
      trace_id: true
      span_id: true
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %5p [%X{trace_id},%X{span_id}] %logger{36} - %msg%n"
