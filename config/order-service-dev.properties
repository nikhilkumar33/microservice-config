spring.datasource.url=jdbc:mysql://localhost/zepto
spring.datasource.username=root
spring.datasource.password=Nikhil@123
# Zipkin configuration
spring.zipkin.base-url=http://localhost:9411
spring.zipkin.enabled=true

# Sleuth configuration
spring.sleuth.sampler.probability=1.0
spring.sleuth.propagation-keys=b3,X-B3-TraceId,X-B3-SpanId,X-B3-ParentSpanId,X-B3-Sampled,X-B3-Flags

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8082
# Feign + Hystrix
feign.hystrix.enabled=true

# Management tracing
management.tracing.sampling.probability=1.0

# Actuator endpoints exposure
management.endpoints.web.exposure.include=*

# Logging pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %5p [${spring.application.name},%X{traceId},%X{spanId}] %logger{36} - %msg%n
